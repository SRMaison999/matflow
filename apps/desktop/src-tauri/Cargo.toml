[package]
name = "matflow-desktop"
version = "0.1.0"
description = "MatFlow Desktop Application"
authors = ["MatFlow Team"]
license = "UNLICENSED"
repository = ""
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = [
    "shell-open",
    "dialog-all",
    "fs-all",
    "path-all",
    "os-all",
    "process-all",
    "protocol-asset",
    "window-all",
    "global-shortcut-all",
    "clipboard-all",
    "notification-all"
] }
tauri-plugin-store = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
tauri-plugin-sql = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1", features = ["sqlite"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
