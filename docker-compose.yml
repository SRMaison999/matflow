# Docker Compose pour développement local MatFlow
# Usage: docker-compose up -d

version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: matflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: matflow
      POSTGRES_USER: matflow
      POSTGRES_PASSWORD: matflow_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matflow -d matflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache Redis
  redis:
    image: redis:7-alpine
    container_name: matflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Stockage S3-compatible (MinIO)
  minio:
    image: minio/minio:latest
    container_name: matflow-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: matflow
      MINIO_ROOT_PASSWORD: matflow_minio_password
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Interface d'admin PostgreSQL (optionnel)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: matflow-pgadmin
    restart: unless-stopped
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@matflow.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # Interface Redis (optionnel)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: matflow-redis-ui
    restart: unless-stopped
    profiles:
      - tools
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

volumes:
  postgres_data:
    name: matflow_postgres_data
  redis_data:
    name: matflow_redis_data
  minio_data:
    name: matflow_minio_data

networks:
  default:
    name: matflow_network
